name: Python tests and failure reporting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests and syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(Path('.').rglob('*.py'))
          files = [p for p in files if not any(part in {'.git', '.venv', 'venv', '__pycache__'} for part in p.parts)]
          errors = []
          for path in files:
              try:
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              except (SyntaxError, UnicodeDecodeError) as exc:
                  errors.append(f'{path}: {exc}')
          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print(f'Syntax OK: checked {len(files)} Python files')
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  report-failure:
    name: Create or update an issue if main-branch tests fail
    needs: tests
    if: ${{ always() && needs.tests.result == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Create one open CI failure issue (avoid duplicates)
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[CI] Automated tests failing on main';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            const details = [
              'The automated test or Python syntax-check job failed on the main branch.',
              '',
              `- Workflow run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Trigger: ${context.eventName}`,
              '',
              'Open the workflow run for the failing step and logs. Close this issue after the failure is fixed and the workflow passes.'
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another failure was detected.\n\n${details}`
              });
              core.info(`Added failure details to existing issue #${existing.number}`);
            } else {
              let created;
              try {
                created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: details,
                  labels: ['bug']
                });
              } catch (error) {
                if (error.status !== 422) throw error;
                created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: details
                });
              }
              core.info(`Created issue #${created.data.number}`);
            }
